name: orbit

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orbit}
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - orbit_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  valkey:
    image: docker.io/valkey/valkey:9.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  mailpit:
    image: docker.io/axllent/mailpit:v1.30.7
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  minio:
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orbit}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orbit_local_secret}
    # The bucket itself is created by Orbit.Api's ObjectStorageBucketInitializer hosted service on
    # startup, not by this image — MINIO_DEFAULT_BUCKETS does not auto-create it on this release.
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - orbit_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  clamav:
    # Malware scanning for uploaded attachments (Orbit.Worker's AttachmentScanProcessor talks to
    # this over clamd's INSTREAM TCP protocol on port 3310). Opt-in: set
    # AttachmentScanning__Enabled=true for Orbit.Worker to actually use it - otherwise a
    # NoOpAttachmentScanner runs instead, e.g. in sandboxes without network access to pull this image.
    image: docker.io/clamav/clamav:1.4
    platform: linux/amd64
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - orbit_clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s # first boot downloads virus definitions, which is slow
    restart: unless-stopped

volumes:
  orbit_pgdata:
  orbit_minio_data:
  orbit_clamav_data:
