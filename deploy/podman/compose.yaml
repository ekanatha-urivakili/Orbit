name: orbit

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orbit}
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - orbit_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  valkey:
    image: docker.io/valkey/valkey:9.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  mailpit:
    image: docker.io/axllent/mailpit:v1.30.7
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  minio:
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orbit}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orbit_local_secret}
    # The bucket itself is created by Orbit.Api's ObjectStorageBucketInitializer hosted service on
    # startup, not by this image — MINIO_DEFAULT_BUCKETS does not auto-create it on this release.
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - orbit_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  clamav:
    # Malware scanning for uploaded attachments (Orbit.Worker's AttachmentScanProcessor talks to
    # this over clamd's INSTREAM TCP protocol on port 3310). Opt-in: set
    # AttachmentScanning__Enabled=true for Orbit.Worker to actually use it - otherwise a
    # NoOpAttachmentScanner runs instead, e.g. in sandboxes without network access to pull this image.
    image: docker.io/clamav/clamav:1.4
    platform: linux/amd64
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - orbit_clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s # first boot downloads virus definitions, which is slow
    restart: unless-stopped

  otel-collector:
    # §4.3 (ADR-023): local sink for the OTLP traces/metrics/logs Orbit.Api and Orbit.Worker
    # already export (default target localhost:4317). Not part of start-dev.sh's blocking
    # wait_for_container list - same precedent as clamav above, observability infra shouldn't
    # slow every dev boot.
    image: docker.io/otel/opentelemetry-collector-contrib:0.159.0
    volumes:
      - ../otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    # No healthcheck: the contrib image is a distroless-style build with no shell, wget, or curl
    # to probe the health_check extension's HTTP endpoint (13133) with - `podman logs` is the way
    # to confirm it's receiving/exporting.
    restart: unless-stopped
    depends_on:
      - loki
      - tempo

  prometheus:
    image: docker.io/prom/prometheus:v3.6.0
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - orbit_prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  loki:
    image: docker.io/grafana/loki:3.5.9
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ../loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - orbit_loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  tempo:
    image: docker.io/grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../tempo/tempo.yaml:/etc/tempo.yaml:ro
      - orbit_tempo_data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    # No healthcheck: this image is also a distroless-style build with no shell/wget (same as
    # otel-collector above) - GET http://localhost:3200/ready from the host to confirm manually.
    restart: unless-stopped

  grafana:
    # Local-only visualization for the collector's output - datasources are pre-provisioned
    # (deploy/grafana/provisioning) so it's usable with zero manual setup. No dashboards/alert
    # rules are authored here; that's an explicit non-goal of the architecture doc this stack
    # implements ("a dashboarding product decision... made separately").
    image: docker.io/grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-orbit_local}
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - orbit_grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  orbit_pgdata:
  orbit_minio_data:
  orbit_clamav_data:
  orbit_prometheus_data:
  orbit_loki_data:
  orbit_tempo_data:
  orbit_grafana_data:
