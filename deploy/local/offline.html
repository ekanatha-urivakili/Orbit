<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbit is starting up</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f5f7;
      color: #172b4d;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #161a1d; color: #e5e7eb; }
      .card { background: #1d2125 !important; border-color: #394047 !important; }
      .dot { background: #394047 !important; }
      .dot.active { background: #579dff !important; }
    }
    .card {
      background: #fff;
      border: 1px solid #dfe1e6;
      border-radius: 16px;
      padding: 40px 36px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(9, 30, 66, 0.12);
    }
    .logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #0052cc;
      color: #fff;
      display: inline-grid;
      place-items: center;
      font-weight: 800;
      font-size: 20px;
      margin-bottom: 18px;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.5; color: #626d84; margin: 0 0 22px; }
    .dots { display: flex; gap: 6px; justify-content: center; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #dfe1e6; transition: background .2s; }
    .dot.active { background: #0052cc; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">O</div>
    <h1>Orbit is starting up</h1>
    <p>We can't reach the local dev server yet. This page will refresh automatically as soon as it's back.</p>
    <div class="dots" aria-hidden="true">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
  </div>
  <script>
    var dots = document.querySelectorAll('.dot');
    var frame = 0;
    setInterval(function () {
      frame = (frame + 1) % dots.length;
      dots.forEach(function (dot, i) { dot.classList.toggle('active', i === frame); });
    }, 400);

    function checkAndReload() {
      fetch(window.location.origin + '/', { method: 'HEAD', cache: 'no-store' })
        .then(function (response) {
          if (response.ok) window.location.reload();
        })
        .catch(function () {
          // still down — keep polling
        });
    }
    setInterval(checkAndReload, 3000);
  </script>
</body>
</html>
