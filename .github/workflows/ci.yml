name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: orbit_test
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      valkey:
        image: valkey/valkey:9.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore Orbit.slnx --locked-mode

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build backend
        run: dotnet build Orbit.slnx --configuration Release --no-restore

      - name: Apply schema to PostgreSQL
        run: dotnet ef database update --project src/Orbit.Infrastructure --startup-project src/Orbit.Infrastructure --no-build --configuration Release
        env:
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=orbit_test;Username=orbit;Password=orbit_ci

      - name: Test architecture boundaries
        run: dotnet test tests/Orbit.ArchitectureTests/Orbit.ArchitectureTests.csproj --configuration Release --no-build --no-restore

      - name: Test backend (domain)
        run: dotnet test tests/Orbit.Domain.Tests/Orbit.Domain.Tests.csproj --configuration Release --no-build --no-restore --collect:"XPlat Code Coverage"

      - name: Test backend (application)
        run: dotnet test tests/Orbit.Application.Tests/Orbit.Application.Tests.csproj --configuration Release --no-build --no-restore --collect:"XPlat Code Coverage"

      - name: Test backend (integration)
        run: dotnet test tests/Orbit.IntegrationTests/Orbit.IntegrationTests.csproj --configuration Release --no-build --no-restore --collect:"XPlat Code Coverage"
        env:
          POSTGRES_PASSWORD: orbit_ci

      - name: Publish coverage summary
        if: always()
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          files = sorted(glob.glob("tests/**/TestResults/**/coverage.cobertura.xml", recursive=True))
          print("### Backend coverage\n")
          if not files:
              print("No coverage files found.")
          else:
              print("| Project | Line coverage | Branch coverage |")
              print("|---|---|---|")
              for f in files:
                  project = f.split("/TestResults/")[0].split("/")[-1]
                  root = ET.parse(f).getroot()
                  line_rate = float(root.get("line-rate", 0)) * 100
                  branch_rate = float(root.get("branch-rate", 0)) * 100
                  print(f"| {project} | {line_rate:.1f}% | {branch_rate:.1f}% |")
          PY

      - name: Audit NuGet dependencies
        run: dotnet list Orbit.slnx package --vulnerable --include-transitive

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Audit npm dependencies
        working-directory: web
        run: npm audit --audit-level=high

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Test frontend
        working-directory: web
        run: npm test

      - name: Build PWA
        working-directory: web
        run: npm run build

      - name: Lint documentation
        working-directory: web
        run: npm run lint:docs

      - name: Upload PWA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orbit-pwa
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E smoke test
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Download built PWA
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: orbit-pwa
          path: web/dist

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke test
        working-directory: web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  migration-safety:
    name: Migration safety
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore .NET dependencies
        run: dotnet restore Orbit.slnx --locked-mode

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build Infrastructure project
        run: dotnet build src/Orbit.Infrastructure/Orbit.Infrastructure.csproj --configuration Release --no-restore

      - name: Check for destructive migrations
        run: scripts/ci/migration-safety.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Informational only until a burn-in period with no false positives has passed;
          # see CI-CD-PLAN.md Phase 2. Set to "true" to make this check block merges.
          MIGRATION_SAFETY_ENFORCE: 'false'

  build-images:
    name: Build ${{ matrix.name }} image
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: worker
            dockerfile: Dockerfile.worker
    outputs:
      api-digest: ${{ steps.collect.outputs.api-digest }}
      worker-digest: ${{ steps.collect.outputs.worker-digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/orbit-${{ matrix.name }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}/{1}/orbit-{2}:{3}', env.REGISTRY, env.IMAGE_NAMESPACE, matrix.name, github.ref_name) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Scan image for known-fixable vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/orbit-${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Collect digest
        id: collect
        run: echo "${{ matrix.name }}-digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  build-web-image:
    name: Build web image (${{ matrix.environment }})
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    outputs:
      staging-digest: ${{ steps.collect.outputs.staging-digest }}
      production-digest: ${{ steps.collect.outputs.production-digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # VITE_API_URL / VITE_OIDC_AUTHORITY / VITE_OIDC_CLIENT_ID are baked into the compiled
      # JS at build time (Vite), so each environment needs its own image. Define these as
      # Environment variables (not secrets — they're public URLs/client ids) on the "staging"
      # and "production" GitHub Environments before this job can build a real image; see
      # CI-CD-PLAN.md Phase 3 and deploy/railway/README.md for the values Railway expects.
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile.web
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/orbit-web:${{ github.sha }}-${{ matrix.environment }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}/{1}/orbit-web:{2}-{3}', env.REGISTRY, env.IMAGE_NAMESPACE, github.ref_name, matrix.environment) || '' }}
          cache-from: type=gha,scope=web-${{ matrix.environment }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.environment }}

      - name: Scan image for known-fixable vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/orbit-web:${{ github.sha }}-${{ matrix.environment }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Collect digest
        id: collect
        run: echo "${{ matrix.environment }}-digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  release-manifest:
    name: Publish release manifest
    needs: [build-images, build-web-image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore and build Infrastructure project
        run: |
          dotnet restore Orbit.slnx --locked-mode
          dotnet tool restore
          dotnet build src/Orbit.Infrastructure/Orbit.Infrastructure.csproj --configuration Release --no-restore

      - name: Generate idempotent migration bundle
        run: >-
          dotnet ef migrations script --idempotent
          --project src/Orbit.Infrastructure --startup-project src/Orbit.Infrastructure
          --no-build --configuration Release -o migration-bundle.sql

      - name: Write release manifest
        run: |
          cat > release-manifest.json <<JSON
          {
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref_name }}",
            "createdAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "images": {
              "api": "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/orbit-api@${{ needs.build-images.outputs.api-digest }}",
              "worker": "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/orbit-worker@${{ needs.build-images.outputs.worker-digest }}",
              "web": {
                "staging": "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/orbit-web@${{ needs.build-web-image.outputs.staging-digest }}",
                "production": "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/orbit-web@${{ needs.build-web-image.outputs.production-digest }}"
              }
            },
            "migrationBundle": "migration-bundle.sql"
          }
          JSON
          cat release-manifest.json

      - name: Upload release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-manifest-${{ github.sha }}
          path: |
            release-manifest.json
            migration-bundle.sql
          if-no-files-found: error
          retention-days: 90
