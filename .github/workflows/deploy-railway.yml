name: Deploy to Railway

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected Railway environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: railway-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.37.3

      - name: Restore migration tooling
        run: dotnet restore Orbit.slnx --locked-mode

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Apply expand-only migrations
        run: railway run --service orbit-api dotnet ef database update --project src/Orbit.Infrastructure --startup-project src/Orbit.Infrastructure
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy API
        run: railway up --ci --service orbit-api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy worker
        run: railway up --ci --service orbit-worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy PWA
        run: railway up --ci --service orbit-web
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
